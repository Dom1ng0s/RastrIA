<svg width="760" height="520" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="760" height="520" fill="#ffffff"/>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.4"/>
</marker>
<marker id="triangle" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
<path d="M1 1 L11 6 L1 11 Z" fill="#ffffff" stroke="#5f5e5a" stroke-width="1"/>
</marker>
</defs>

<!-- Usuario -->
<rect x="30" y="30" width="200" height="120" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="130" y="50" text-anchor="middle" font-size="13" font-weight="bold">Usuario</text>
<line x1="30" y1="58" x2="230" y2="58" stroke="#5F5E5A"/>
<text x="40" y="74" font-size="11">+ id</text>
<text x="40" y="88" font-size="11">+ nome</text>
<text x="40" y="102" font-size="11">+ email</text>
<line x1="30" y1="110" x2="230" y2="110" stroke="#5F5E5A"/>
<text x="40" y="126" font-size="11">cadastrarRegistroSaude()</text>
<text x="40" y="140" font-size="11">solicitarAtendimento()</text>

<!-- RegistroSaude -->
<rect x="30" y="220" width="200" height="110" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="130" y="240" text-anchor="middle" font-size="13" font-weight="bold">RegistroSaude</text>
<line x1="30" y1="248" x2="230" y2="248" stroke="#0F6E56"/>
<text x="40" y="264" font-size="11">+ tipo</text>
<text x="40" y="278" font-size="11">+ valor</text>
<text x="40" y="292" font-size="11">+ dataColeta</text>
<line x1="30" y1="300" x2="230" y2="300" stroke="#0F6E56"/>
<text x="40" y="316" font-size="11">verificarIndice()</text>

<!-- Atendimento -->
<rect x="290" y="220" width="200" height="110" rx="6" fill="#FFF1EC" stroke="#B8431F"/>
<text x="390" y="240" text-anchor="middle" font-size="13" font-weight="bold">Atendimento</text>
<line x1="290" y1="248" x2="490" y2="248" stroke="#B8431F"/>
<text x="300" y="264" font-size="11">+ status</text>
<text x="300" y="278" font-size="11">+ dataHora</text>
<line x1="290" y1="286" x2="490" y2="286" stroke="#B8431F"/>
<text x="300" y="302" font-size="11">registrarProntuario()</text>

<!-- Profissional -->
<rect x="530" y="30" width="200" height="120" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="630" y="50" text-anchor="middle" font-size="13" font-weight="bold">Profissional</text>
<line x1="530" y1="58" x2="730" y2="58" stroke="#534AB7"/>
<text x="540" y="74" font-size="11">+ registroProfissional</text>
<text x="540" y="88" font-size="11">+ especialidade</text>
<text x="540" y="102" font-size="11">+ disponibilidade</text>
<line x1="530" y1="110" x2="730" y2="110" stroke="#534AB7"/>
<text x="540" y="126" font-size="11">aceitarSolicitacao()</text>

<!-- Medico -->
<rect x="450" y="380" width="140" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="520" y="400" text-anchor="middle" font-size="13" font-weight="bold">Medico</text>
<line x1="450" y1="408" x2="590" y2="408" stroke="#534AB7"/>
<text x="460" y="424" font-size="11">+ crm</text>

<!-- EducadorFisico -->
<rect x="610" y="380" width="140" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="680" y="400" text-anchor="middle" font-size="13" font-weight="bold">EducadorFisico</text>
<line x1="610" y1="408" x2="750" y2="408" stroke="#534AB7"/>
<text x="620" y="424" font-size="11">+ cref</text>

<!-- relations -->
<line x1="130" y1="150" x2="130" y2="220" stroke="#5f5e5a" marker-end="url(#arrow2)"/>
<text x="140" y="188" font-size="10" fill="#5f5e5a">1   possui   *</text>

<line x1="230" y1="90" x2="530" y2="90" stroke="#5f5e5a" marker-end="url(#arrow2)"/>
<text x="330" y="84" font-size="10" fill="#5f5e5a">1   solicita/realiza   *</text>

<line x1="230" y1="275" x2="290" y2="275" stroke="#5f5e5a"/>

<path d="M630 150 L630 250 L490 275" fill="none" stroke="#5f5e5a" marker-end="url(#arrow2)"/>

<line x1="520" y1="380" x2="600" y2="150" stroke="#5f5e5a" marker-end="url(#triangle)"/>
<line x1="680" y1="380" x2="650" y2="150" stroke="#5f5e5a" marker-end="url(#triangle)"/>
</svg>
