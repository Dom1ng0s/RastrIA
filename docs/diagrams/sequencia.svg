<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="640" height="480" fill="#ffffff"/>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.4"/>
</marker>
</defs>

<!-- lifelines -->
<rect x="60" y="20" width="120" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="120" y="43" text-anchor="middle" font-size="13" font-weight="bold">Usuário</text>
<line x1="120" y1="56" x2="120" y2="460" stroke="#c9c7bd" stroke-dasharray="3 3"/>

<rect x="260" y="20" width="120" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="320" y="43" text-anchor="middle" font-size="13" font-weight="bold">Sistema</text>
<line x1="320" y1="56" x2="320" y2="460" stroke="#c9c7bd" stroke-dasharray="3 3"/>

<rect x="460" y="20" width="120" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="520" y="43" text-anchor="middle" font-size="13" font-weight="bold">Profissional</text>
<line x1="520" y1="56" x2="520" y2="460" stroke="#c9c7bd" stroke-dasharray="3 3"/>

<!-- messages -->
<line x1="120" y1="90" x2="315" y2="90" stroke="#5f5e5a" marker-end="url(#arrow3)"/>
<text x="130" y="84" font-size="11">Cadastra exame ou índice</text>

<path d="M320 110 C 350 110 350 130 320 130" fill="none" stroke="#5f5e5a" marker-end="url(#arrow3)"/>
<text x="360" y="123" font-size="11">Verifica contra tabela</text>

<line x1="315" y1="160" x2="125" y2="160" stroke="#5f5e5a" stroke-dasharray="4 2" marker-end="url(#arrow3)"/>
<text x="130" y="154" font-size="11">Mostra resultado</text>

<line x1="120" y1="200" x2="315" y2="200" stroke="#5f5e5a" marker-end="url(#arrow3)"/>
<text x="130" y="194" font-size="11">Solicita acompanhamento</text>

<line x1="320" y1="240" x2="515" y2="240" stroke="#5f5e5a" marker-end="url(#arrow3)"/>
<text x="330" y="234" font-size="11">Notifica profissionais da rede</text>

<line x1="515" y1="280" x2="325" y2="280" stroke="#5f5e5a" stroke-dasharray="4 2" marker-end="url(#arrow3)"/>
<text x="330" y="274" font-size="11">Confirma atendimento</text>

<line x1="315" y1="320" x2="125" y2="320" stroke="#5f5e5a" stroke-dasharray="4 2" marker-end="url(#arrow3)"/>
<text x="130" y="314" font-size="11">Conecta com profissional</text>

<line x1="520" y1="360" x2="325" y2="360" stroke="#5f5e5a" marker-end="url(#arrow3)"/>
<text x="330" y="354" font-size="11">Registra prontuário</text>

<line x1="315" y1="400" x2="125" y2="400" stroke="#5f5e5a" stroke-dasharray="4 2" marker-end="url(#arrow3)"/>
<text x="130" y="394" font-size="11">Atualiza histórico</text>
</svg>
