# CI do monorepo (issue #68): roda em todo pull request e em push na main/develop.
# Cada job espelha o que um contribuidor roda localmente — ver agents/claude.md.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Build de produção com uma URL de API de exemplo: exercita a geração da
      # CSP (config/csp.js), que derruba o build se a origem tiver curinga.
      - run: npm run build
        env:
          VITE_API_URL: https://api.exemplo.com/api

  acessibilidade:
    name: Frontend (varredura axe — Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  backend:
    name: Backend (ruff, check --deploy, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Settings de produção: falha em erro de configuração; os avisos (ex.:
      # HSTS, #63) ficam visíveis no log.
      - name: python manage.py check --deploy
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --settings=rastria.settings.prod
        env:
          ALLOWED_HOSTS: api.exemplo.com
      - run: python manage.py makemigrations --check --dry-run
      # Inclui a matriz papel × endpoint (tests/test_permissoes.py). As
      # vulnerabilidades ainda abertas estão marcadas como expected failure
      # com a issue de cada uma; quando uma for corrigida, o "unexpected
      # success" deixa este passo vermelho até o marcador sair.
      - run: python -W error::rest_framework.pagination.UnorderedObjectListWarning manage.py test

  seguranca:
    name: Dependências (npm audit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Só dependências que vão para produção, a partir de alta. As de
      # desenvolvimento ficam com o Dependabot (.github/dependabot.yml).
      - name: npm audit (serviço da raiz — serve)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (frontend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
